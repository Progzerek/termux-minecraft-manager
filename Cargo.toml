[package]
name = "termux-mc-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["clock"] }
dotenvy = "0.15.7"
rcon = { version = "0.6", features = ["rt-tokio"] }
reqwest = { version = "0.12", features = ["json"] }
serde = "1.0.229"
serenity = "0.12.5"
tokio = { version = "1.54.1", features = ["full"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
